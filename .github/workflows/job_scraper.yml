name: Job Scraper

on:
  schedule:
    # Every 6 hours (UTC)
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      mark_seen_only:
        description: "Backfill matching jobs into the seen DB without sending alerts"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

concurrency:
  group: job-scraper-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ensure data directory exists
        run: mkdir -p data

      - name: Restore seen-jobs database cache
        uses: actions/cache@v4
        with:
          path: data
          key: seen-jobs-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            seen-jobs-db-${{ runner.os }}-

      - name: Show restored database status
        run: |
          if [ -f data/seen_jobs.db ]; then
            python -c "from database import JobDatabase; print('Restored seen jobs:', JobDatabase('data/seen_jobs.db').count_seen())"
          else
            echo "No seen-jobs database restored; this run will create one."
          fi

      - name: Run job scraper
        env:
          ENABLE_TELEGRAM: ${{ secrets.ENABLE_TELEGRAM }}
          ENABLE_EMAIL: ${{ secrets.ENABLE_EMAIL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_SMTP_HOST: ${{ secrets.EMAIL_SMTP_HOST }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
        run: |
          if [ "${{ github.event.inputs.mark_seen_only }}" = "true" ]; then
            python main.py --mark-seen-only
          else
            python main.py
          fi

      - name: Show updated database status
        if: always()
        run: |
          if [ -f data/seen_jobs.db ]; then
            python -c "from database import JobDatabase; print('Updated seen jobs:', JobDatabase('data/seen_jobs.db').count_seen())"
          else
            echo "No seen-jobs database was created."
          fi

      - name: Upload database artifact (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seen-jobs-db
          path: data/seen_jobs.db
          retention-days: 30
          if-no-files-found: ignore
